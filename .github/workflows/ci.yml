name: ci 
on:
  push:
    branches:
      - master 
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v3
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install "mkdocs-material==9.7.6"
      - run: pip install mdx_truly_sane_lists
      - run: pip install mkdocs-glightbox
      - run: pip install mkdocs-heti-plugin
      - run: pip install mkdocs-statistics-plugin
      - run: pip install "mkdocs-rss-plugin==1.17.9"
      - run: pip install mkdocs-minify-plugin
      - run: pip install "mkdocs-material[imaging]==9.7.6"
      - run: pip3 install mkdocs-git-revision-date-localized-plugin   
      - run: sudo apt-get install -y pngquant
      - run: find docs -name "*.png" -size +500k -exec pngquant --ext .png --force --quality=65-85 --skip-if-larger {} \;
      - run: mkdocs gh-deploy --force
